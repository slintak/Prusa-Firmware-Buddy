syntax = "proto3";

package connect2;

// CONNECT2 command protocol for printer-side MQTT transport.
//
// This file is intended to become the single source of truth for the command
// mapping between legacy Connect JSON/WebSocket commands and the new
// CONNECT2 protobuf/MQTT transport.
//
// Design rules for this file:
// - Every message documents which legacy JSON command it replaces.
// - We document old JSON field names exactly as they appeared on the wire.
// - We prefer explicit typed payload messages over one giant "bag of fields".
// - The firmware still decides how much of the full legacy protocol is
//   implemented in a given milestone; this file documents the full intended
//   direction, not only the first subset.
//
// Legacy JSON shape reminder:
// {
//   "command": "COMMAND_NAME",
//   "kwargs": {
//     ... command-specific fields ...
//   }
// }
//
// The outer legacy command envelope also had command_id outside of the JSON
// body in some internal layers, but CONNECT-side behavior is best understood as
// a command name plus kwargs and an associated command_id.

// Top-level command envelope sent from proxy/server to printer over MQTT.
//
// Replaces many legacy JSON commands that were previously delivered over the
// WebSocket path and parsed in src/connect/command.cpp.
message CommandEnvelope {
  // Legacy meaning: command identifier associated with the incoming command.
  // In old Connect code this was not encoded as a JSON field in the inner
  // command payload, but it existed as command metadata throughout the planner.
  uint32 command_id = 1;

  // Exactly one typed payload should be present.
  oneof payload {
    SendInfoCommand send_info = 10;
    SendJobInfoCommand send_job_info = 11;
    SendFileInfoCommand send_file_info = 12;
    SendTransferInfoCommand send_transfer_info = 13;
    PausePrintCommand pause_print = 14;
    ResumePrintCommand resume_print = 15;
    StopPrintCommand stop_print = 16;
    StartPrintCommand start_print = 17;
    SetPrinterReadyCommand set_printer_ready = 18;
    CancelPrinterReadyCommand cancel_printer_ready = 19;
    SetIdleCommand set_idle = 20;
    DeleteFileCommand delete_file = 21;
    DeleteFolderCommand delete_folder = 22;
    CreateFolderCommand create_folder = 23;
    StopTransferCommand stop_transfer = 24;
    SetTokenCommand set_token = 25;
    ResetPrinterCommand reset_printer = 26;
    SendStateInfoCommand send_state_info = 27;
    DialogActionCommand dialog_action = 28;
    SetValueCommand set_value = 29;
    CancelObjectCommand cancel_object = 30;
    UncancelObjectCommand uncancel_object = 31;
    StartInlineDownloadCommand start_inline_download = 32;
    StartConnectDownloadCommand start_connect_download = 33;
    StartEncryptedDownloadCommand start_encrypted_download = 34;
  }
}

// Replaces legacy JSON command:
// {
//   "command": "SEND_INFO",
//   "kwargs": {}
// }
//
// Purpose:
// Ask the printer to emit an INFO event immediately.
message SendInfoCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "SEND_JOB_INFO",
//   "kwargs": {
//     "job_id": 123
//   }
// }
//
// Legacy behavior:
// - job_id was optional
// - if job_id was present, firmware rejected mismatched active job id
// - if no job was active, firmware rejected the request
message SendJobInfoCommand {
  // True when the request carries the legacy kwargs.job_id filter.
  bool has_job_id = 1;

  // Legacy JSON key: kwargs.job_id
  uint32 job_id = 2;
}

// Replaces legacy JSON command:
// {
//   "command": "SEND_FILE_INFO",
//   "kwargs": {
//     "path": "/usb"
//   }
// }
//
// Legacy aliases:
// - path
// - path_sfn
//
// Purpose:
// Ask the printer to emit FILE_INFO for a file or directory on USB.
message SendFileInfoCommand {
  // Legacy JSON key: kwargs.path or kwargs.path_sfn
  string path = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "SEND_TRANSFER_INFO",
//   "kwargs": {}
// }
//
// Purpose:
// Ask the printer to emit current transfer progress/state.
message SendTransferInfoCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "PAUSE_PRINT",
//   "kwargs": {}
// }
message PausePrintCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "RESUME_PRINT",
//   "kwargs": {}
// }
message ResumePrintCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "STOP_PRINT",
//   "kwargs": {}
// }
message StopPrintCommand {
}

// Old Connect supported optional tool mapping in START_PRINT.
// The JSON parser accepted a nested kwargs.tool_mapping object.
//
// External tool numbering in JSON was 1-based.
// Firmware-side internal mapping historically used 0-based indices.
message ToolMappingPair {
  // External tool slot number as seen by Connect JSON.
  uint32 source_tool = 1;

  // External target tool number as seen by Connect JSON.
  uint32 target_tool = 2;
}

// Replaces legacy JSON command:
// {
//   "command": "START_PRINT",
//   "kwargs": {
//     "path": "/usb/file.bgcode",
//     "tool_mapping": {
//       "1": [1, 2, ...]
//     }
//   }
// }
//
// In practice the first firmware milestone may only use path and ignore
// tool_mapping, but the schema documents the full intended legacy replacement.
message StartPrintCommand {
  // Legacy JSON key: kwargs.path or kwargs.path_sfn
  string path = 1;

  // Optional flattened representation of legacy kwargs.tool_mapping.
  // We intentionally flatten it instead of encoding a sparse nested map so the
  // schema remains easier to use from constrained code generators.
  repeated ToolMappingPair tool_mapping = 2;
}

// Replaces legacy JSON command:
// {
//   "command": "SET_PRINTER_READY",
//   "kwargs": {}
// }
message SetPrinterReadyCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "CANCEL_PRINTER_READY",
//   "kwargs": {}
// }
message CancelPrinterReadyCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "SET_IDLE",
//   "kwargs": {}
// }
message SetIdleCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "DELETE_FILE",
//   "kwargs": {
//     "path": "/usb/file.gcode"
//   }
// }
message DeleteFileCommand {
  string path = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "DELETE_FOLDER",
//   "kwargs": {
//     "path": "/usb/folder"
//   }
// }
message DeleteFolderCommand {
  string path = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "CREATE_FOLDER",
//   "kwargs": {
//     "path": "/usb/new-folder"
//   }
// }
message CreateFolderCommand {
  string path = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "STOP_TRANSFER",
//   "kwargs": {}
// }
message StopTransferCommand {
}

// Replaces legacy JSON command:
// {
//   "command": "SET_TOKEN",
//   "kwargs": {
//     "token": "..."
//   }
// }
//
// This was part of older Connect registration/token flows. Our current
// CONNECT2 OAuth/JWT path may never need it operationally, but we keep it in
// the schema because it is part of the legacy JSON protocol surface.
message SetTokenCommand {
  // Legacy JSON key: kwargs.token
  string token = 1;
}

// Replaces either of the legacy JSON commands:
// {
//   "command": "RESET_PRINTER",
//   "kwargs": {}
// }
// or
// {
//   "command": "RESET",
//   "kwargs": {}
// }
//
// Legacy behavior treated both spellings the same on Buddy.
message ResetPrinterCommand {
  // True if the original upstream JSON command string was exactly "RESET".
  // This is not required for printer behavior, but it is useful if the proxy
  // ever wants to preserve exact legacy spelling for debugging.
  bool legacy_reset_alias = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "SEND_STATE_INFO",
//   "kwargs": {}
// }
message SendStateInfoCommand {
}

// Connect dialog button identifiers used both in old JSON and future protobuf.
// These string values historically appeared in the JSON buttons array and in
// kwargs.button when sending DIALOG_ACTION.
enum DialogButton {
  DIALOG_BUTTON_UNSPECIFIED = 0;
  DIALOG_BUTTON_OK = 1;
  DIALOG_BUTTON_CANCEL = 2;
  DIALOG_BUTTON_YES = 3;
  DIALOG_BUTTON_NO = 4;
  DIALOG_BUTTON_RETRY = 5;
  DIALOG_BUTTON_ABORT = 6;
  DIALOG_BUTTON_IGNORE = 7;
  DIALOG_BUTTON_CONTINUE = 8;
  DIALOG_BUTTON_STOP = 9;
  DIALOG_BUTTON_PAUSE = 10;
  DIALOG_BUTTON_RESUME = 11;
  DIALOG_BUTTON_DONE = 12;
  DIALOG_BUTTON_COOLDOWN = 13;
  DIALOG_BUTTON_UNLOAD = 14;
  DIALOG_BUTTON_LOAD = 15;
}

// Replaces legacy JSON command:
// {
//   "command": "DIALOG_ACTION",
//   "kwargs": {
//     "dialog_id": 123,
//     "button": "YES"
//   }
// }
message DialogActionCommand {
  // Legacy JSON key: kwargs.dialog_id
  uint32 dialog_id = 1;

  // Legacy JSON key: kwargs.button
  DialogButton button = 2;
}

// Property names accepted by old JSON SET_VALUE command.
//
// Many of these directly mirror old kwargs keys. The comments intentionally
// preserve the old JSON path spelling so that this enum becomes a migration
// index for future developers.
enum SetValueProperty {
  SET_VALUE_PROPERTY_UNSPECIFIED = 0;

  // Legacy JSON key: kwargs.hostname
  SET_VALUE_PROPERTY_HOSTNAME = 1;

  // Legacy JSON key: kwargs.enclosure_enabled
  SET_VALUE_PROPERTY_ENCLOSURE_ENABLED = 2;

  // Legacy JSON key: kwargs.enclosure_printing_filtration
  SET_VALUE_PROPERTY_ENCLOSURE_PRINTING_FILTRATION = 3;

  // Legacy JSON key: kwargs.enclosure_postprint
  SET_VALUE_PROPERTY_ENCLOSURE_POSTPRINT = 4;

  // Legacy JSON key: kwargs.enclosure_postprint_filtration_time
  SET_VALUE_PROPERTY_ENCLOSURE_POSTPRINT_FILTRATION_TIME = 5;

  // Legacy JSON keys:
  // - kwargs.tools.<n>.nozzle_diameter
  SET_VALUE_PROPERTY_NOZZLE_DIAMETER = 6;

  // Legacy JSON keys:
  // - kwargs.tools.<n>.high_flow
  SET_VALUE_PROPERTY_NOZZLE_HIGH_FLOW = 7;

  // Legacy JSON keys:
  // - kwargs.tools.<n>.hardened
  SET_VALUE_PROPERTY_NOZZLE_HARDENED = 8;

  // Legacy JSON key: kwargs.chamber.target_temp
  SET_VALUE_PROPERTY_CHAMBER_TARGET_TEMP = 9;

  // Legacy JSON key: kwargs.chamber.fan_pwm_target
  SET_VALUE_PROPERTY_CHAMBER_FAN_PWM_TARGET = 10;

  // Legacy JSON key: kwargs.addon_power
  SET_VALUE_PROPERTY_ADDON_POWER = 11;

  // Legacy JSON key: kwargs.chamber.led_intensity
  SET_VALUE_PROPERTY_CHAMBER_LED_INTENSITY = 12;
}

// Replaces legacy JSON command:
// {
//   "command": "SET_VALUE",
//   "kwargs": {
//     ... one supported property encoded as a key-value pair ...
//   }
// }
//
// Legacy SET_VALUE was unusual: the property name was encoded as the key name
// in kwargs rather than as a value of a field named "property".
//
// This protobuf form normalizes the legacy shape into:
// - a typed property enum
// - an optional tool index for per-tool values
// - one strongly typed value payload
message SetValueCommand {
  SetValueProperty property = 1;

  // Used for per-tool properties such as nozzle diameter/high_flow/hardened.
  // Keep 1-based external numbering to match Connect-facing semantics.
  uint32 tool_index = 2;

  oneof value {
    bool bool_value = 10;
    uint32 uint32_value = 11;
    sint32 int32_value = 12;
    float float_value = 13;
    string string_value = 14;
  }
}

// Replaces legacy JSON command:
// {
//   "command": "CANCEL_OBJECT",
//   "kwargs": {
//     "id": 3
//   }
// }
message CancelObjectCommand {
  // Legacy JSON key: kwargs.id
  uint32 object_id = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "UNCANCEL_OBJECT",
//   "kwargs": {
//     "id": 3
//   }
// }
message UncancelObjectCommand {
  // Legacy JSON key: kwargs.id
  uint32 object_id = 1;
}

// Replaces legacy JSON command:
// {
//   "command": "START_INLINE_DOWNLOAD",
//   "kwargs": {
//     "path": "/usb/file.gcode",
//     "orig_size": 123456,
//     "team_id": 42,
//     "hash": "base64-or-fingerprint"
//   }
// }
//
// Legacy note:
// START_CONNECT_DOWNLOAD was parsed exactly like START_INLINE_DOWNLOAD in
// Buddy firmware. The naming difference came from server-side routing choices.
message StartInlineDownloadCommand {
  string path = 1;
  uint32 orig_size = 2;
  uint64 team_id = 3;
  string hash = 4;
}

// Replaces legacy JSON command:
// {
//   "command": "START_CONNECT_DOWNLOAD",
//   "kwargs": {
//     "path": "/usb/file.gcode",
//     "orig_size": 123456,
//     "team_id": 42,
//     "hash": "base64-or-fingerprint"
//   }
// }
//
// We keep this as a distinct protobuf message so the proxy can preserve exact
// legacy intent if needed, even though old Buddy firmware handled it the same
// way as START_INLINE_DOWNLOAD.
message StartConnectDownloadCommand {
  string path = 1;
  uint32 orig_size = 2;
  uint64 team_id = 3;
  string hash = 4;
}

// Replaces legacy JSON command:
// {
//   "command": "START_ENCRYPTED_DOWNLOAD",
//   "kwargs": {
//     "path": "/usb/file.gcode",
//     "orig_size": 123456,
//     "key": "hex-encoded 16-byte key",
//     "iv": "hex-encoded 16-byte iv-or-nonce",
//     "port": 1234
//   }
// }
//
// Historical note:
// Legacy code comments mention that iv kept its old AES-CBC name even after the
// implementation moved to AES-CTR semantics, where it behaves as a nonce.
message StartEncryptedDownloadCommand {
  string path = 1;
  uint32 orig_size = 2;

  // Raw binary 16-byte key. Legacy JSON used a hex string in kwargs.key.
  bytes key = 3;

  // Raw binary 16-byte iv/nonce. Legacy JSON used a hex string in kwargs.iv.
  bytes iv = 4;

  // Legacy JSON key: kwargs.port. Optional override in old JSON parser.
  bool has_port = 5;
  uint32 port = 6;
}
