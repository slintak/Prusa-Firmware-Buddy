[project]
name = "oauth-mqtt-sandbox"
version = "0.1.0"
description = "Local sandbox for OAuth 2.0 Device Flow with MQTT."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyjwt>=2.8",
  "jwcrypto>=1.5",
  "python-multipart>=0.0.9",
  "paho-mqtt>=1.6.1",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
server = "oauth_server.main:main"
device_flow = "scripts.device_flow:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["oauth_server", "scripts"]
